ews.com/2026/09/03/stem-cell-clinics-fda-cber-warning-letters-marketing/?utm_campaign=rss", "src": "STAT News", "role": "权威媒体", "cat": "行业媒体", "tier": "collapsed", "rel": 27, "when": "今天"}, {"id": "url:https://rockhealth.com/how-to-advance-healthcare-quality-though-digital-health/", "t": "如何通过数字健康提高医​​疗质量", "te": "How to advance healthcare quality though digital health", "s": "医疗保健质量在虚拟医疗保健环境中表现在哪里？创新者、投资者和医疗保健提供者应如何处理此范例中的质量问题？从临床医生的角度来看，我们请 Rock Health 投资组合公司 Vivante Health 的首席医疗官 Simon Mathews 分享了关于数字健康如何在四个维度上提高护理质量方面发挥作用的观点。如何通过数字健康提高医​​疗保健质量一文首先出现在 Rock Health 上。", "se": "Where does healthcare quality show up in the virtual healthcare context, and how should innovators, investors, and healthcare providers approach questions about quality in this paradigm? For a clinician's point of view, we turned to Simon Mathews, Chief Medical Officer of Rock Health portfolio company Vivante Health, to share a perspective on how digital health can play a role in advancing care quality across four dimensions. The post How to advance healthcare quality though digital health first appeared on Rock Health .", "u": "https://rockhealth.com/how-to-advance-healthcare-quality-though-digital-health/", "src": "Rock Health", "role": "VC 官方博客", "cat": "资本信息", "tier": "archive", "rel": 35, "when": "1981 天前"}, {"id": "url:https://rockhealth.com/the-next-nuance-to-the-platform-wars/", "t": "平台大战的下一个细微差别", "te": "The next Nuance to the platform wars", "s": "昨天，微软宣布将以 16B 美元收购 Nuance Communications，这是自去年 Teladongo 打响虚拟平台战争发令枪以来最大的数字健康收购。了解我们对大型科技公司为何如此关注医生工作流程解决方案的看法，以及这对他们未来的医疗保健战略意味着什么。平台大战的下一个细微差别帖子首次出现在 Rock Health 上。", "se": "Yesterday, Microsoft announced it was acquiring Nuance Communications for $16B, the largest digital health acquisition since Teladongo’s starter pistol to the virtual platform wars was fired off last year. Check out our take on why big tech companies are so focused on physician workflow solutions—and what this means for their healthcare strategies going forward. The post The next Nuance to the platform wars first appeared on Rock Health .", "u": "https://rockhealth.com/the-next-nuance-to-the-platform-wars/", "src": "Rock Health", "role": "VC 官方博客", "cat": "资本信息", "tier": "archive", "rel": 35, "when": "1969 天前"}, {"id": "url:https://rockhealth.com/building-a-coherent-go-to-market-for-digital-health-solutions-a-qa-with-zs-associates-vijesh-unnikrishnan-and-dan-macleod/", "t": "为数字健康解决方案制定一致的上市策略：与 ZS Associates 的 Vijesh Unnikrishnan 和 Dan MacLeod 的问答", "te": "Building a Coherent Go-To-Market Strategy for Digital Health Solutions: A Q&A with ZS Associates’ Vijesh Unnikrishnan and Dan MacLeod", "s": "在过去的十年里，数字医疗一直是一个充满希望、不断增长的领域。随着疫情对医疗保健系统提出新的要求，对数字化护理和服务的需求一夜之间激增。即使大流​​行隧道尽头出现了曙光，数字健康的势头也没有显示出放缓的迹象。 2020 年，美国私营数字健康公司的投资超过 14B 美元，这一数字与 2021 年的投资相比可能相形见绌，其中 6.7B 美元已于 2021 年第一季度投入使用。凭借大量资金，更多公司正在努力推进数字医疗的承诺。", "se": "Digital health has been a promising, growing space over the past decade. And with the pandemic putting new demands on the healthcare system, demand for digitally-enabled care and services spiked overnight. Even as a light has emerged at the end of the pandemic tunnel, momentum toward digital health shows no signs of slowing down. Over $14B was invested across 2020 in private US digital health companies, a number likely to be dwarfed by 2021 investment, with $6.7B already put to work in Q1 2021. With plenty of funding in tow, more companies are on their way to advancing the promise of digital transformation and achieving meaningful scale. The post Building a Coherent Go-To-Market Strategy for Digital Health Solutions: A Q&A with ZS Associates’ Vijesh Unnikrishnan and Dan MacLeod first appeared on Rock Health .", "u": "https://rockhealth.com/building-a-coherent-go-to-market-for-digital-health-solutions-a-qa-with-zs-associates-vijesh-unnikrishnan-and-dan-macleod/", "src": "Rock Health", "role": "VC 官方博客", "cat": "资本信息", "tier": "archive", "rel": 35, "when": "1959 天前"}, {"id": "url:https://rockhealth.com/100-digital-health-ceos-on-navigating-growth-change-and-challenges/", "t": "100 多位数字医疗首席执行官探讨如何应对增长、变革和挑战", "te": "100+ Digital Health CEOs on Navigating Growth, Change, And Challenges", "s": "每年，Rock Health 都会聚集 100 多位数字健康首席执行官，进行坦诚的闭门对话，讨论如何在数字健康领域打造一家成功的公司。在与宾夕法尼亚大学风险实验室联合主办的 2021 年数字健康首席执行官峰会上，我们邀请了一群多元化的首席执行官，他们的组织的成长阶段涵盖从种子期前一直到成功退出。讨论的主题包括精心策划、进入市场、包容性招聘实践以及应对不确定时期等主题。在这个亲密的环境中，首席执行官们分享了诚实和有价值的信息", "se": "Each year, Rock Health brings together more than 100 digital health CEOs for candid, closed-door conversations about how to build a successful company in digital health. For the 2021 Digital Health CEO Summit, co-hosted with Venture Lab at the University of Pennsylvania, we were joined by a diverse group of CEOs whose organizations’ growth stages ranged from pre-seed all the way through successful exits. Discussions focused on topics like crafting pitches, going to market, inclusive hiring practices, and navigating times of uncertainty. In this intimate setting, CEOs shared honest and valuable insights about their experiences in transforming healthcare. The post 100+ Digital Health CEOs on Navigating Growth, Change, And Challenges first appeared on Rock Health .", "u": "https://rockhealth.com/100-digital-health-ceos-on-navigating-growth-change-and-challenges/", "src": "Rock Health", "role": "VC 官方博客", "cat": "资本信息", "tier": "archive", "rel": 35, "when": "1938 天前"}, {"id": "url:https://rockhealth.com/an-inside-look-at-enterprise-digital-innovation-highlights-from-the-rock-health-spring-2021-member-retreat/", "t": "深入了解企业数字化创新：Rock Health 2021 年春季会员务虚会亮点", "te": "An Inside Look at Enterprise Digital Innovation: Highlights from the Rock Health Spring 2021 Member Retreat", "s": "最近，我们有幸邀请了来自世界各地主要医疗保健组织的二十多名数字健康高管参加我们的虚拟春季会员静修会。虽然代表了不同的组织（提供商、付款人、生物制药、零售、科技）和角色（创新、公司开发、风险投资），但每位静修参与者都有一个重要特征——对推动组织内数字创新的热情。 Rock Health 会员静修会旨在进行互动、坦诚的对话，促进社区建设并为企业数字创新产生想法", "se": "We recently had the privilege of hosting over two dozen digital health executives from major healthcare organizations across the world for our virtual Spring Member Retreat. While representing a diverse set of organizations (provider, payer, biopharma, retail, tech) and roles (innovation, corp dev, venture), each retreat attendee shared one important characteristic—a passion for driving digital innovation within their organization. Rock Health Member Retreats are designed to be interactive, candid conversations that foster community building and generate ideas for enterprise digital innovation initiatives. And the timing of the retreat couldn’t have been any better. The post An Inside Look at Enterprise Digital Innovation: Highlights from the Rock Health Spring 2021 Member Retreat first appeared on Rock Health .", "u": "https://rockhealth.com/an-inside-look-at-enterprise-digital-innovation-highlights-from-the-rock-health-spring-2021-member-retreat/", "src": "Rock Health", "role": "VC 官方博客", "cat": "资本信息", "tier": "archive", "rel": 35, "when": "1910 天前"}, {"id": "url:https://rockhealth.com/pear-going-public-via-spac-take-a-bite-out-of-that/", "t": "Pear 通过 SPAC 上市：尝尝鲜", "te": "Pear going public via SPAC: Take a bite out of that", "s": "解读 Pear Therapeutics 的 SPAC 公告——这对 SPAC 对数字健康市场的影响意味着什么，以及即将上市的 Pear 发展轨迹的机会。 Pear 通过 SPAC 上市的帖子：咬一口首先出现在 Rock Health 上。", "se": "Unpacking the SPAC announcement from Pear Therapeutics—what this means for SPACs’ impact on the digital health market and the opportunities for the soon-to-be public Pear’s trajectory. The post Pear going public via SPAC: Take a bite out of that first appeared on Rock Health .", "u": "https://rockhealth.com/pear-going-public-via-spac-take-a-bite-out-of-that/", "src": "Rock Health", "role": "VC 官方博客", "cat": "资本信息", "tier": "archive", "rel": 35, "when": "1899 天前"}, {"id": "url:https://rockhealth.com/ro-acquires-modern-fertility-segment-specific-ma-another-front-in-the-platform-wars/", "t": "Ro 收购 Modern Fertility：针对特定细分市场的并购是平台大战的另一条战线", "te": "Ro acquires Modern Fertility: Segment-specific M&A another front in the platform wars", "s": "Ro 收购 Modern Fertility 代表着针对特定人群或需求（在本例中为生育）的特定细分市场服务与以广泛人群为中心的虚拟护理平台相结合所创造的机会。这笔交易不会是远程医疗和导航平台收购专注于特定细分市场的初创公司的最后一笔交易。 Ro 收购 Modern Fertility 后：平台大战中特定细分市场的并购另一条战线首次出现在 Rock Health 上。", "se": "Ro acquiring Modern Fertility represents the opportunity created when segment-specific services for a given population or need—in this case fertility—combine with wide-population focused virtual care platforms. This deal won’t be the last transaction where telehealth and navigation platforms snap up startups focused on segment-specific verticals. The post Ro acquires Modern Fertility: Segment-specific M&A another front in the platform wars first appeared on Rock Health .", "u": "https://rockhealth.com/ro-acquires-modern-fertility-segment-specific-ma-another-front-in-the-platform-wars/", "src": "Rock Health", "role": "VC 官方博客", "cat": "资本信息", "tier": "archive", "rel": 5, "when": "1928 天前"}, {"id": "url:https://rockhealth.com/zus-health-investment/", "t": "医疗保健的数据、互操作性和工作流程支柱：宣布我们对 Zus Health 的投资", "te": "Healthcare’s data, interoperability, and workflow backbone: Announcing our investment in Zus Health", "s": "从历史上看，美国医疗保健系统的分散性使得提供者、药房和付款人几乎不可能合作并提供协调的护理，而患者传统上几乎无法访问或控制自己的健康数据。医疗保健利益相关者之间通常很少有有效的、符合 HIPAA 要求的数据共享，从而导致有价值且可能挽救生命的信息被困在数据孤岛中。医疗保健的数据、互操作性和工作流程支柱：宣布我们对 Zus Health 的投资首先出现在 Roc 上", "se": "Historically, the fragmented nature of the U.S. healthcare system has made it nearly impossible for providers, pharmacies, and payers to collaborate and provide coordinated care—and patients have traditionally had almost no access to or control over their own health data. There has generally been little in the way of effective, HIPAA-compliant data sharing between healthcare stakeholders, leaving valuable—and potentially life-saving information—stuck in data silos. The post Healthcare’s data, interoperability, and workflow backbone: Announcing our investment in Zus Health first appeared on Rock Health .", "u": "https://rockhealth.com/zus-health-investment/", "src": "Rock Health", "role": "VC 官方博客", "cat": "资本信息", "tier": "archive", "rel": 5, "when": "1904 天前"}, {"id": "url:https://rockhealth.com/wellbeing-benefits-for-the-modern-workforce-our-investment-in-joon/", "t": "现代劳动力的福祉福利：我们对 JOON 的投资", "te": "Wellbeing benefits for the modern workforce: Our investment in JOON", "s": "我们很高兴地宣布对 JOON 的投资，JOON 正在开发现代化的福利解决方案，使雇主及其员工能够轻松实现员工健康。 JOON 通过自动验证和报销雇主设定类别（例如健身、食品、心理健康、家庭护理和教育）内的合格购买，让员工可以自由选择对他们有意义的东西。后福利对现代劳动力的好处：我们对 JOON 的投资首先出现在 Rock Health 上。", "se": "We’re thrilled to announce our investment in JOON, which is developing a modernized benefits solution that makes employee wellness easy for employers and their workforce. JOON gives employees the freedom to choose what’s meaningful to them by automatically verifying and reimbursing eligible purchases within the employer-set categories, such as fitness, food, mental health, family care, and education. The post Wellbeing benefits for the modern workforce: Our investment in JOON first appeared on Rock Health .", "u": "https://rockhealth.com/wellbeing-benefits-for-the-modern-workforce-our-investment-in-joon/", "src": "Rock Health", "role": "VC 官方博客", "cat": "资本信息", "tier": "archive", "rel": 5, "when": "1877 天前"}, {"id": "url:https://rockhealth.com/were-hiring-a-sales-operations-manager/", "t": "我们正在招聘一名销售运营经理！", "te": "We’re hiring a Sales Operations Manager!", "s": "", "se": "", "u": "https://rockhealth.com/were-hiring-a-sales-operations-manager/", "src": "Rock Health", "role": "VC 官方博客", "cat": "资本信息", "tier": "archive", "rel": 5, "when": "1834 天前"}, {"id": "url:https://news.crunchbase.com/startups/tech-layoffs/", "t": "Crunchbase 科技裁员追踪器", "te": "The Crunchbase Tech Layoffs Tracker", "s": "根据 Crunchbase News 的统计，2025 年，美国科技公司将有超过 127,000 名员工在大规模裁员中被解雇，而且裁员将持续到 2026 年。查看最新裁员的公司。", "se": "Over 127,000 workers at U.S.-based tech companies were laid off in mass job cuts in 2025, per a Crunchbase News tally, and the layoffs have continued into 2026. See the latest companies to cut roles.", "u": "https://news.crunchbase.com/startups/tech-layoffs/", "src": "Crunchbase News", "role": "权威媒体", "cat": "资本信息", "tier": "archive", "rel": 5, "when": "8 天前"}, {"id": "url:https://news.crunchbase.com/venture/supply-chain-nontech-founder-ilya-levtov-craft/", "t": "Craft 的 Ilya Levtov 从未学过编程。无论如何，他建立了一家软件公司。", "te": "Craft’s Ilya Levtov Never Learned To Code. He Built A Software Company Anyway.", "s": "在关于非科技创始人获得风险投资的系列文章的第四篇中，我们采访了 Craft 首席执行官伊利亚·列夫托夫 (Ilya Levtov)，他是一位受过茱莉亚音乐学院培训的大提琴家，他表示尽管从未编写过一行代码，但他能够创办自己的供应链智能软件公司。", "se": "In the fourth of a series of articles about non-tech founders getting venture funding, we talk to Craft CEO Ilya Levtov, a Julliard-trained cellist who says he was able to launch his supply chain intelligence software company despite having never written a single line of code.", "u": "https://news.crunchbase.com/venture/supply-chain-nontech-founder-ilya-levtov-craft/", "src": "Crunchbase News", "role": "权威媒体", "cat": "资本信息", "tier": "archive", "rel": 5, "when": "7 天前"}, {"id": "url:https://news.crunchbase.com/venture/socure-raises-acquires-agentic-ai-startup-fravity/", "t": "Socure 以 5.2B 估值获得 1.56 亿美元融资，收购人工智能欺诈调查初创公司 Fravity", "te": "Socure Secures $156M at $5.2B Valuation, Acquires AI Fraud Investigation Startup Fravity", "s": "身份验证和欺诈预防公司 Socure 周四宣布，其在战略增长投资中筹集了 1.56 亿美元，估值达 52 亿美元。这家总部位于内华达州 Incline Village 的公司还表示，正在收购代理人工智能初创公司 Fravity，该公司将作为 RiskOS_Agents 并入其 RiskOS 平台。", "se": "Identity verification and fraud prevention company Socure announced Thursday that it raised $156 million in a strategic growth investment valuing it at $5.2 billion. The Incline Village, Nevada-based company also says it is acquiring agentic AI startup Fravity, which will be incorporated into its RiskOS platform as RiskOS_Agents.", "u": "https://news.crunchbase.com/venture/socure-raises-acquires-agentic-ai-startup-fravity/", "src": "Crunchbase News", "role": "权威媒体", "cat": "资本信息", "tier": "archive", "rel": 5, "when": "7 天前"}, {"id": "url:https://www.medtechdive.com/news/medtronic-recalls-ph-monitoring-capsule-linked-to-184-serious-injuries/829038/", "t": "美敦力 (Medtronic) 召回与 184 人严重受伤有关的 pH 监测胶囊", "te": "Medtronic recalls pH monitoring capsule linked to 184 serious injuries", "s": "由于可能阻塞患者呼吸道的故障，美敦力两年内第二次将胶囊从市场上撤下。", "se": "For the second time in two years, Medtronic has pulled capsules from the market over a fault that could obstruct patients&rsquo; airways.", "u": "https://www.medtechdive.com/news/medtronic-recalls-ph-monitoring-capsule-linked-to-184-serious-injuries/829038/", "src": "MedTech Dive", "role": "主信源", "cat": "行业媒体", "tier": "archive", "rel": 5, "when": "6 天前"}, {"id": "url:https://news.crunchbase.com/venture/record-breaking-space-tech-startup-funding-spcx/", "t": "行业概况：太空科技初创公司融资创下新高", "te": "Sector Snapshot: Space Tech Startup Funding Orbits New Highs", "s": "根据 Crunchbase 的数据，今年迄今为止，全球种子期到成长阶段的资金已流向太空和卫星相关行业的公司，创纪录的 203 亿美元。这已经是迄今为止最高的年度记录，距离 2026 年还有四个月的时间。", "se": "So far this year, a record $20.3 billion in global seed- through growth-stage funding has gone to companies in space- and satellite-related sectors, per Crunchbase data. That’s already by far the highest annual tally on record, and we’ve still got four months left in 2026.", "u": "https://news.crunchbase.com/venture/record-breaking-space-tech-startup-funding-spcx/", "src": "Crunchbase News", "role": "权威媒体", "cat": "资本信息", "tier": "archive", "rel": 5, "when": "6 天前"}, {"id": "url:https://news.crunchbase.com/venture/biggest-funding-rounds-ai-tools-assistants-instinct/", "t": "本周最大的 10 轮融资：人工智能工具和助手引领大型交易的稀疏阵容", "te": "The Week’s 10 Biggest Funding Rounds: AI Tools And Assistants Lead Sparser Lineup Of Megadeals", "s": "本周最大的融资接受者大多数都是专注于人工智能的初创公司，其中人工智能助手开发商 Instinct 获得了最大一轮融资。", "se": "Most of this week’s largest funding recipients were AI-focused startups, with Instinct, a developer of AI assistants, pulling in the biggest round.", "u": "https://news.crunchbase.com/venture/biggest-funding-rounds-ai-tools-assistants-instinct/", "src": "Crunchbase News", "role": "权威媒体", "cat": "资本信息", "tier": "archive", "rel": 5, "when": "6 天前"}, {"id": "url:https://news.crunchbase.com/health-wellness-biotech/startup-investment-exits-steady-ai-2026/", "t": "尽管人工智能资金激增，生物技术初创公司投资仍保持稳定", "te": "Biotech Startup Investment Held Steady Even As AI Funding Surged", "s": "尽管人工智能的繁荣扰乱了整个创业领域的融资模式，但生物技术仍然是一个罕见的稳定投资领域。过去几年，全球生物技术初创公司的融资额一直徘徊在 360 亿美元至 400 亿美元之间。根据 Crunchbase 的数据，2026 年有望保持接近该范围。", "se": "While the AI boom has disrupted funding patterns across the startup sphere, biotech has remained a rare steady sector for investment. For the past few years, global funding to biotech startups has hovered between $36 billion and $40 billion. Per Crunchbase data, 2026 is on track to stay close to that range.", "u": "https://news.crunchbase.com/health-wellness-biotech/startup-investment-exits-steady-ai-2026/", "src": "Crunchbase News", "role": "权威媒体", "cat": "资本信息", "tier": "archive", "rel": 5, "when": "3 天前"}, {"id": "url:https://www.medtechdive.com/news/boston-scientific-discontinues-angiographic-catheters/829186/", "t": "波士顿科学 (Boston Scientific) 停止生产血管造影导管", "te": "Boston Scientific discontinues angiographic catheters", "s": "由于制造问题导致该公司将其 Imager II 血管造影导管从市场上撤下，该公司计划停止销售该设备。", "se": "The company plans to stop selling its Imager II Angiographic Catheters after a manufacturing problem led the company to pull the devices from the market.", "u": "https://www.medtechdive.com/news/boston-scientific-discontinues-angiographic-catheters/829186/", "src": "MedTech Dive", "role": "主信源", "cat": "行业媒体", "tier": "archive", "rel": 5, "when": "3 天前"}, {"id": "url:https://www.statnews.com/2026/09/01/american-diabetes-association-june-conference-independent-review/?utm_campaign=rss", "t": "观点：糖尿病协会首席执行官：独立审查称 ADA 备受争议的 6 月会议上发生了什么", "te": "Opinion: Diabetes association CEO: What an independent review says happened at the ADA’s controversial June conference", "s": "美国糖尿病协会首席执行官查尔斯·“查克”·亨德森写道：“现在我们的社区不能承受自我斗争的代价。”", "se": "“This is not a aju) 写道。", "se": "“The longer I practice, the more I think many conflicts in maternity care come from a simple misunderstanding,” writes Debra Eluobaju, a doula turned OB-GYN.", "u": "https://www.statnews.com/2026/09/03/doula-turned-ob-gyn-birth-plan-disappointment-urgency/?utm_campaign=rss", "src": "STAT News", "role": "权威媒体", "cat": "行业媒体", "tier": "archive", "rel": 5, "when": "今天"}, {"id": "url:https://www.statnews.com/2026/09/03/vaccine-hesitant-parents-how-pediatrician-builds-trust/?utm_campaign=rss", "t": "儿科医生接待对疫苗持怀疑态度的父母，而其他人则不会", "te": "The pediatricians who take in vaccine-skeptical parents others won’t", "s": "在“最后的做法”中，儿科医生优先考虑减轻父母对疫苗的担忧，而不是强行解雇。", "se": "At a \"practice of last resort,\" pediatricians prioritize allaying parents' vaccine concerns without hardline dismissals.", "u": "https://www.statnews.com/2026/09/03/vaccine-hesitant-parents-how-pediatrician-builds-trust/?utm_campaign=rss", "src": "STAT News", "role": "权威媒体", "cat": "行业媒体", "tier": "archive", "rel": 5, "when": "今天"}, {"id": "url:https://www.statnews.com/2026/09/03/drug-overdose-deaths-down-sharply-commonwealth-fund-study/?utm_campaign=rss", "t": "为什么药物过量死亡人数下降？", "te": "Why are drug overdose deaths declining?", "s": "一份新报告称，纳洛酮和减少危害措施可能有助于遏制药物过量死亡。", "se": "Naloxone and harm reduction measures may be helping to curb drug overdose deaths, a new report says.", "u": "https://www.statnews.com/2026/09/03/drug-overdose-deaths-down-sharply-commonwealth-fund-study/?utm_campaign=rss", "src": "STAT News", "role": "权威媒体", "cat": "行业媒体", "tier": "archive", "rel": 5, "when": "今天"}], "kws": [{"term": "digital health", "n": 17}, {"term": "fda", "n": 8}, {"term": "medical device", "n": 2}], "srcs": [{"name": "MedTech Dive", "role": "主信源", "status": "ok", "n": 10, "ok": true}, {"name": "STAT News", "role": "权威媒体", "status": "ok", "n": 20, "ok": true}, {"name": "Crunchbase News", "role": "权威媒体", "status": "ok", "n": 10, "ok": true}, {"name": "Rock Health", "role": "VC 官方博客", "status": "ok", "n": 10, "ok": true}, {"name": "Hacker News", "role": "社区信号", "status": "ok_no_updates", "n": 0, "ok": true}], "updated": "09-03 19:12 CST"}</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const tierCN = {must_read:'必读',skim:'速览',collapsed:'浏览',archive:'归档'};
const tierCls = {must_read:'bg-signal text-white',skim:'bg-moss/15 text-moss',collapsed:'bg-slate-500/15',archive:'bg-slate-500/10'};
let fCat='全部', fTier='全部', fKw='', fQ='';
const $ = s => document.querySelector(s);
const esc = s => (s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('#navStatus').textContent = D.status;
$('#statSrc').textContent = D.nSrc;
$('#statItems').textContent = D.nItems;
$('#statHot').textContent = D.items.filter(i=>['must_read','skim'].includes(i.tier)).length;
$('#statUpd').textContent = D.updated;

if (D.spot) {
  const s = D.spot;
  $('#spot').classList.remove('hidden');
  $('#spotT').textContent = s.t || s.te; $('#spotT').href = s.u;
  $('#spotE').textContent = s.te || '';
  $('#spotMeta').innerHTML = `<span class="px-2 py-0.5 rounded-full bg-moss/15 text-moss font-bold">${esc(s.src)}</span>`+
    `<span class="px-2 py-0.5 rounded-full bg-signal/15 text-signal font-bold">相关度 ${s.rel}</span><span>${esc(s.when)}</span>`;
  $('#spotS').textContent = s.s || s.se || '';
}

function card(it, rank) {
  const rankHtml = rank != null ? `<div class="tnum text-signal/90 w-9 shrink-0 pt-0.5">${String(rank).padStart(2,'0')}</div>` : '';
  const zh = it.t || it.te;
  return `<article class="card flex gap-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/60 p-3.5">
    ${rankHtml}
    <div class="min-w-0 flex-1">
      <a href="${esc(it.u)}" target="_blank" rel="noopener" class="font-semibold leading-snug hover:text-signal">${esc(zh)}</a>
      ${it.te ? `<div class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 break-words">${esc(it.te)}</div>` : ''}
      <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-[11px] mt-1.5 text-slate-500 dark:text-slate-400">
        <span class="font-bold text-moss">${esc(it.src)}</span>
        <span class="px-1.5 py-0.5 rounded-full ${tierCls[it.tier]}">${tierCN[it.tier]}</span>
        <span class="px-1.5 py-0.5 rounded-full border border-moss/40 text-moss font-bold">相关度 ${it.rel}</span>
        <span>${esc(it.when)}</span><span>· ${esc(it.cat)}</span>
      </div>
      ${(it.s||it.se) ? `<p class="text-[13px] mt-1.5 leading-relaxed text-slate-600 dark:text-slate-300">${esc(it.s||it.se)}</p>` : ''}
    </div></article>`;
}

const byId = Object.fromEntries(D.items.map(i=>[i.id,i]));
$('#topList').innerHTML = D.top.map((id,ix)=>{const it=byId[id];return it?card(it,ix+1):''}).join('');

const cats = ['全部',...new Set(D.items.map(i=>i.cat))];
$('#catTabs').innerHTML = cats.map(c=>`<button data-cat="${esc(c)}" class="tab px-2.5 py-1 rounded-full border ${c==='全部'?'bg-signal text-white border-signal':'border-slate-300 dark:border-slate-700'}">${esc(c)}</button>`).join('');
const tiers = ['全部','must_read','skim','collapsed','archive'];
$('#tierTabs').innerHTML = tiers.map(t=>`<button data-tier="${t}" class="ttab px-2.5 py-1 rounded-full border ${t==='全部'?'bg-moss text-white border-moss':'border-slate-300 dark:border-slate-700'}">${t==='全部'?'全部层级':tierCN[t]}</button>`).join('');
$('#kws').innerHTML = '<span class="text-slate-500">热词：</span>' + D.kws.map(k=>`<button data-kw="${esc(k.term)}" class="kw px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-signal">${esc(k.term)} <span class="text-slate-400">${k.n}</span></button>`).join('');

function apply(){
  const list = D.items.filter(i =>
    (fCat==='全部'||i.cat===fCat) && (fTier==='全部'||i.tier===fTier) &&
    (!fKw || ((i.t+i.te+i.s+i.se).toLowerCase().includes(fKw.toLowerCase()))) &&
    (!fQ || ((i.t+i.te+i.s+i.se+i.src).toLowerCase().includes(fQ.toLowerCase()))));
  $('#feed').innerHTML = list.map(i=>card(i,null)).join('');
  $('#empty').classList.toggle('hidden', list.length>0);
}
document.body.addEventListener('click', e=>{
  const t=e.target.closest('.tab,.ttab,.kw'); if(!t) return;
  if(t.classList.contains('tab')){fCat=t.dataset.cat;document.querySelectorAll('.tab').forEach(b=>b.className='tab px-2.5 py-1 rounded-full border '+(b===t?'bg-signal text-white border-signal':'border-slate-300 dark:border-slate-700'));}
  if(t.classList.contains('ttab')){fTier=t.dataset.tier;document.querySelectorAll('.ttab').forEach(b=>b.className='ttab px-2.5 py-1 rounded-full border '+(b===t?'bg-moss text-white border-moss':'border-slate-300 dark:border-slate-700'));}
  if(t.classList.contains('kw')){fKw=(fKw===t.dataset.kw?'':t.dataset.kw);document.querySelectorAll('.kw').forEach(b=>b.classList.toggle('border-signal', b.dataset.kw===fKw));}
  apply();
});
$('#q').addEventListener('input', e=>{fQ=e.target.value.trim(); apply();});

$('#srcs').innerHTML = D.srcs.map(s=>`
  <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/60 p-3 flex items-center gap-2 text-sm">
    <span class="w-2 h-2 rounded-full ${s.ok?'bg-moss':'bg-signal'}"></span>
    <span class="font-bold">${esc(s.name)}</span><span class="text-xs text-slate-500">${esc(s.role)}</span>
    <span class="flex-1"></span><span class="text-xs text-slate-500">${s.n} 条 · ${esc(s.status)}</span></div>`).join('');

const themeBtn=$('#theme');
function setTheme(dark){document.documentElement.classList.toggle('dark',dark);themeBtn.textContent=dark?'🌙':'☀️';localStorage.setItem('theme',dark?'dark':'light');}
setTheme((localStorage.getItem('theme')||'dark')==='dark');
themeBtn.onclick=()=>setTheme(!document.documentElement.classList.contains('dark'));

apply();
</script>
</body></html>
