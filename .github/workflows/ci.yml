name: SIH Tests
on:
  pull_request:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s engine/tests -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
