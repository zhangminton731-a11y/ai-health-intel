name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['output/site/**']
  workflow_run:
    workflows: ["Daily Health Intel Aggregation"]
    types: [completed]
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      - name: Record the validated checkout
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate publication before deployment
        run: python scripts/quality_gate.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: 'output/site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare public Pages with the validated batch
        env:
          REVISION: ${{ needs.build.outputs.revision }}
        run: python scripts/readback_deployment.py "$REVISION"

  notify:
    needs: [build, deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Notify deployment failure
        env:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          FEISHU_BOT_SECRET: ${{ secrets.FEISHU_BOT_SECRET }}
        run: python scripts/notify_feishu.py --message "奇点医研 Pages 部署失败，请检查 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
