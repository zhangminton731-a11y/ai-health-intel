name: Published Site Monitor
on:
  schedule:
    # Beijing 09:23 and 21:23. Shares GitHub's scheduling limitations.
    - cron: '23 1,13 * * *'
  workflow_dispatch:
concurrency:
  group: published-site-monitor-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore acknowledged notification receipt
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state/receipt.json
          key: published-monitor-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: published-monitor-v1-${{ github.ref_name }}-
      - name: Check published batch and notify June on exception
        if: github.ref == 'refs/heads/main'
        env:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          FEISHU_BOT_SECRET: ${{ secrets.FEISHU_BOT_SECRET }}
        run: python scripts/check_published.py
      - name: Preserve receipt after an unhealthy check
        if: always() && github.ref == 'refs/heads/main' && hashFiles('.monitor-state/receipt.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .monitor-state/receipt.json
          key: published-monitor-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
